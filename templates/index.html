<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extractor de Texto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fff;
            color: #222;
        }
        .card {
            background-color: #f8f9fa;
        }
        /* Modo oscuro automático */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #181a1b !important;
                color: #e0ffe0 !important;
            }
            .card {
                background-color: #23272b !important;
                color: #e0ffe0 !important;
            }
            .form-control {
                background-color: #23272b;
                color: #e0ffe0;
                border-color: #444;
            }
            .form-control:focus {
                background-color: #23272b;
                color: #e0ffe0;
                border-color: #98fb98;
                box-shadow: 0 0 0 0.25rem rgba(152, 251, 152, 0.25);
            }
            .form-control::placeholder {
                color: #aaa;
            }
            .btn-primary {
                background-color: #2e8b57;
                border-color: #2e8b57;
            }
            .btn-primary:hover {
                background-color: #3cb371;
                border-color: #3cb371;
            }
            .btn-outline-success {
                color: #98fb98;
                border-color: #98fb98;
            }
            .btn-outline-success:hover {
                background-color: #2e8b57;
                color: #fff;
                border-color: #2e8b57;
            }
            .alert {
                background-color: #23272b;
                color: #e0ffe0;
                border-color: #2e8b57;
            }
            .loading.active {
                background: rgba(24,26,27,0.8);
            }
        }
        /* Estilos para el selector URL/Archivo en modo claro */
        .btn-outline-primary {
            color: #222;
            border-color: #0d6efd;
        }
        .btn-outline-primary:hover {
            color: #fff;
            background-color: #0d6efd;
        }
        .btn-check:checked + .btn-outline-primary {
            color: #fff;
            background-color: #0d6efd;
        }
        /* Estilos para el selector URL/Archivo en modo oscuro */
        @media (prefers-color-scheme: dark) {
            .btn-outline-primary {
                color: #98fb98;
                border-color: #2e8b57;
            }
            .btn-outline-primary:hover {
                background-color: #2e8b57;
                color: #fff;
                border-color: #2e8b57;
            }
            .btn-check:checked + .btn-outline-primary {
                background-color: #2e8b57;
                border-color: #2e8b57;
                color: #fff;
            }
        }
        .loading {
            display: none;
        }
        .loading.active {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        {% if usuario %}
        <a href="/leer?usuario={{ usuario }}" class="btn btn-outline-success float-end ms-2 mt-2">Ir a Lector</a>
        {% else %}
        <a href="/leer" class="btn btn-outline-success float-end ms-2 mt-2">Ir a Lector</a>
        {% endif %}
        <h1 class="mb-4">Extractor de Texto</h1>
        
        <div class="card">
            <div class="card-body">
                <form id="extractorForm" method="POST" action="/procesar" enctype="multipart/form-data">
                    <!-- Selector de modo: URL o Archivo -->
                    <div class="mb-3">
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="modo_entrada" id="modoUrl" value="url" checked>
                            <label class="btn btn-outline-primary" for="modoUrl">
                                <i class="fas fa-link"></i> URL
                            </label>
                            <input type="radio" class="btn-check" name="modo_entrada" id="modoArchivo" value="archivo">
                            <label class="btn btn-outline-primary" for="modoArchivo">
                                <i class="fas fa-file-pdf"></i> Archivo PDF
                            </label>
                        </div>
                    </div>

                    <div class="mb-3" id="urlGroup">
                        <label for="url" class="form-label">URL del documento</label>
                        <input type="url" class="form-control" id="url" name="url" 
                               value="{{ url }}" placeholder="https://ejemplo.com/documento.pdf">
                        <div class="form-text">Ingrese la URL de un documento PDF o página web</div>
                    </div>

                    <div class="mb-3" id="archivoGroup" style="display: none;">
                        <label for="archivo_pdf" class="form-label">Archivo PDF</label>
                        <input type="file" class="form-control" id="archivo_pdf" name="archivo_pdf" 
                               accept=".pdf,application/pdf">
                        <div class="form-text">Seleccione un archivo PDF de su computadora</div>
                    </div>

                    <div class="mb-3">
                        <label for="titulo" class="form-label">Título</label>
                        <input type="text" class="form-control" id="titulo" name="titulo" required
                               placeholder="Título del documento">
                    </div>

                    <div class="mb-3">
                        <label for="autor" class="form-label">Autor</label>
                        <input type="text" class="form-control" id="autor" name="autor" required
                               placeholder="Autor del documento">
                    </div>

                    <div class="mb-3">
                        <label for="tema" class="form-label">Tema</label>
                        <input type="text" class="form-control" id="tema" name="tema" required
                               placeholder="Tema del documento">
                    </div>

                    {% if usuario %}
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="esPublico" name="es_publico">
                        <label class="form-check-label" for="esPublico">Hacer documento público</label>
                        <input type="hidden" name="usuario" value="{{ usuario }}">
                    </div>
                    {% endif %}

                    <button type="submit" class="btn btn-primary">Procesar Documento</button>
                </form>
            </div>
        </div>

        <!-- Alerta para mostrar mensajes -->
        <div id="alertContainer" class="mt-3" style="display: none;">
            <div class="alert" role="alert"></div>
        </div>
    </div>

    <!-- Indicador de carga -->
    <div class="loading">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle entre modo URL y modo Archivo
        const modoUrl = document.getElementById('modoUrl');
        const modoArchivo = document.getElementById('modoArchivo');
        const urlGroup = document.getElementById('urlGroup');
        const archivoGroup = document.getElementById('archivoGroup');
        const urlInput = document.getElementById('url');
        const archivoInput = document.getElementById('archivo_pdf');

        function toggleModoEntrada() {
            if (modoArchivo.checked) {
                urlGroup.style.display = 'none';
                archivoGroup.style.display = 'block';
                urlInput.removeAttribute('required');
                archivoInput.setAttribute('required', 'required');
            } else {
                urlGroup.style.display = 'block';
                archivoGroup.style.display = 'none';
                urlInput.setAttribute('required', 'required');
                archivoInput.removeAttribute('required');
            }
        }

        modoUrl.addEventListener('change', toggleModoEntrada);
        modoArchivo.addEventListener('change', toggleModoEntrada);

        document.getElementById('extractorForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const loading = document.querySelector('.loading');
            const alertContainer = document.getElementById('alertContainer');
            const alertDiv = alertContainer.querySelector('.alert');
            
            // Validar según modo seleccionado
            if (modoArchivo.checked) {
                if (!archivoInput.files || archivoInput.files.length === 0) {
                    alertDiv.className = 'alert alert-danger';
                    alertDiv.textContent = 'Debe seleccionar un archivo PDF';
                    alertContainer.style.display = 'block';
                    return;
                }
                if (!archivoInput.files[0].name.toLowerCase().endsWith('.pdf')) {
                    alertDiv.className = 'alert alert-danger';
                    alertDiv.textContent = 'Solo se permiten archivos PDF';
                    alertContainer.style.display = 'block';
                    return;
                }
            } else {
                if (!urlInput.value.trim()) {
                    alertDiv.className = 'alert alert-danger';
                    alertDiv.textContent = 'Debe ingresar una URL';
                    alertContainer.style.display = 'block';
                    return;
                }
            }
            
            loading.classList.add('active');
            alertContainer.style.display = 'none';

            try {
                const formData = new FormData(this);
                const esPublicoCheckbox = document.getElementById('esPublico');
                if (esPublicoCheckbox) {
                    formData.set('es_publico', esPublicoCheckbox.checked.toString());
                }
                
                const response = await fetch('/procesar', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                alertDiv.className = `alert alert-${response.ok ? 'success' : 'danger'}`;
                alertDiv.textContent = result.message;
                alertContainer.style.display = 'block';

                if (response.ok) {
                    // Reset del formulario, pero mantener el modo seleccionado
                    this.reset();
                    // Re-establecer estado visual según modo
                    if (modoUrl.checked) {
                        urlGroup.style.display = 'block';
                        archivoGroup.style.display = 'none';
                    } else {
                        urlGroup.style.display = 'none';
                        archivoGroup.style.display = 'block';
                    }
                }
            } catch (error) {
                alertDiv.className = 'alert alert-danger';
                alertDiv.textContent = 'Error al procesar la solicitud';
                alertContainer.style.display = 'block';
            } finally {
                loading.classList.remove('active');
            }
        });
    </script>
</body>
</html>
