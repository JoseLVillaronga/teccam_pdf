<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Documentos</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            color: #98fb98;
        }
        .search-container {
            background-color: #2a2a2a;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .document-list {
            background-color: #2a2a2a;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .document-content {
            background-color: #2a2a2a;
            border-radius: 10px;
            padding: 25px;
            font-size: 2.5em;
            line-height: 1.7;
        }
        .document-item {
            background-color: #333;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
            position: relative;
        }
        .document-item:hover {
            background-color: #444;
        }
        .delete-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #dc3545;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            z-index: 10;
        }
        .delete-btn:hover {
            background-color: #bb2d3b;
        }
        .form-control {
            background-color: #333;
            border-color: #444;
            color: #98fb98;
        }
        .form-control:focus {
            background-color: #333;
            border-color: #98fb98;
            color: #98fb98;
            box-shadow: 0 0 0 0.25rem rgba(152, 251, 152, 0.25);
        }
        .form-control::placeholder {
            color: #666;
        }
        .btn-primary {
            background-color: #2e8b57;
            border-color: #2e8b57;
        }
        .btn-primary:hover {
            background-color: #3cb371;
            border-color: #3cb371;
        }
        .btn-primary:disabled {
            background-color: #1a5c38;
            border-color: #1a5c38;
            cursor: not-allowed;
        }
        /* Estilos para el contenido Markdown convertido */
        .markdown-content {
            color: #98fb98;
        }
        .markdown-content h1, 
        .markdown-content h2, 
        .markdown-content h3, 
        .markdown-content h4, 
        .markdown-content h5, 
        .markdown-content h6 {
            color: #7fff00;
            margin-top: 1em;
            margin-bottom: 0.5em;
            line-height: 1.3;
        }
        .markdown-content h1 {
            font-size: 3.5rem;
        }
        .markdown-content h3 {
            font-size: 2.7rem;
        }
        .markdown-content h4 {
            font-size: 2.75rem;
        }
        .markdown-content h5 {
            font-size: 2.8rem;
        }
        .markdown-content h2 {
            font-size: 3rem;
        }
        .markdown-content h6 {
            font-size: 2.5rem;
        }
        /* Clase para elementos cuyo tamaño se ajusta dinámicamente */
        .fit-to-width {
            font-size: 2.5rem;
        }
        .markdown-content a {
            color: #00ff7f;
        }
        .markdown-content pre {
            background-color: #333;
            padding: 1em;
            border-radius: 5px;
        }
        .markdown-content code {
            color: #ff6b6b;
            background-color: #333;
            padding: 0.2em 0.4em;
            border-radius: 3px;
        }
        .markdown-content blockquote {
            border-left: 4px solid #2e8b57;
            padding-left: 1em;
            margin-left: 0;
            color: #7fffd4;
        }
        
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        
        .toast {
            background-color: #2e8b57;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        
        .toast.show {
            opacity: 1;
        }

        /* Barra de navegación de páginas */
        .page-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding: 15px;
            background-color: #333;
            border-radius: 8px;
            flex-wrap: wrap;
            font-size: 1.35rem;
        }
        .page-navigation * {
            font-size: 1.35rem;
        }
        .page-navigation button {
            background-color: #2e8b57;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .page-navigation button:hover:not(:disabled) {
            background-color: #3cb371;
        }
        .page-navigation button:disabled {
            background-color: #444;
            cursor: not-allowed;
            opacity: 0.5;
        }
        .page-navigation .page-info {
            color: #98fb98;
            padding: 0 10px;
            min-width: 150px;
            text-align: center;
        }
        /* Selector de tamaño de texto */
        .size-selector {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: 10px;
        }
        .size-selector label {
            color: #98fb98;
        }
        .size-selector select {
            background-color: #444;
            color: #98fb98;
            border: 1px solid #2e8b57;
            border-radius: 5px;
            padding: 4px 8px;
            cursor: pointer;
        }
        .size-selector select:focus {
            outline: none;
            border-color: #3cb371;
        }
        .page-input {
            width: 70px;
            text-align: center;
            background-color: #444;
            border: 1px solid #2e8b57;
            color: #98fb98;
            border-radius: 5px;
            padding: 5px;
        }
        .page-input:focus {
            outline: none;
            border-color: #3cb371;
        }

        /* Paginación de búsqueda */
        .search-pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .search-pagination button {
            background-color: #444;
            color: #98fb98;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .search-pagination button:hover:not(:disabled) {
            background-color: #2e8b57;
            border-color: #2e8b57;
        }
        .search-pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .search-pagination button.active {
            background-color: #2e8b57;
            border-color: #2e8b57;
        }
        .search-pagination .page-info {
            color: #98fb98;
            padding: 0 8px;
        }

        /* Loader */
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #444;
            border-top: 3px solid #2e8b57;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-overlay {
            display: none;
            text-align: center;
            padding: 40px;
            color: #98fb98;
        }
        .loading-overlay.show {
            display: block;
        }

        .floating-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(0, 123, 255, 0.7);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
            z-index: 1000;
        }
        .floating-button:hover {
            opacity: 1;
            background-color: rgba(0, 123, 255, 0.9);
        }
        .floating-button i {
            font-size: 24px;
        }
        
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-left: 8px;
        }
        .badge-public {
            background-color: #2e8b57;
            color: white;
        }
        .badge-private {
            background-color: #8b2e57;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        {% if usuario %}
        <a href="/?usuario={{ usuario }}" class="btn btn-outline-primary float-end ms-2 mt-2">Volver al Inicio</a>
        {% else %}
        <a href="/" class="btn btn-outline-primary float-end ms-2 mt-2">Volver al Inicio</a>
        {% endif %}
        <h1 class="mb-4">Lector de Documentos</h1>
        
        <!-- Búsqueda -->
        <div class="search-container mb-4">
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" id="searchTitulo" class="form-control" placeholder="Buscar por título">
                </div>
                <div class="col-md-3">
                    <input type="text" id="searchAutor" class="form-control" placeholder="Buscar por autor">
                </div>
                <div class="col-md-3">
                    <input type="text" id="searchTema" class="form-control" placeholder="Buscar por tema">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100" onclick="buscarDocumentos()">Buscar</button>
                </div>
            </div>
        </div>

        <!-- Lista de documentos -->
        <div class="document-list mb-4" id="documentList">
            <div class="loading-overlay show" id="searchLoading">
                <div class="loader"></div>
                <span>Cargando documentos...</span>
            </div>
            <div id="searchResults"></div>
            <div class="search-pagination" id="searchPagination"></div>
        </div>

        <!-- Contenido del documento -->
        <div class="document-content" id="documentContent" style="display: none;">
            <button class="btn btn-primary mb-3" onclick="volverALista()">Volver a la lista</button>
            
            <!-- Navegación de páginas -->
            <div class="page-navigation mb-3" id="pageNavigation">
                <button id="btnFirstPage" onclick="irAPagina(1)" title="Primera página">
                    <i class="fas fa-fast-backward"></i>
                </button>
                <button id="btnPrevPage" onclick="irAPagina(paginaActual - 1)" title="Página anterior">
                    <i class="fas fa-step-backward"></i>
                </button>
                <span class="page-info">
                    Página <input type="number" class="page-input" id="pageInput" min="1" value="1" onchange="irAPagina(parseInt(this.value))"> de <span id="totalPaginas">0</span>
                </span>
                <button id="btnNextPage" onclick="irAPagina(paginaActual + 1)" title="Página siguiente">
                    <i class="fas fa-step-forward"></i>
                </button>
                <button id="btnLastPage" onclick="irAPagina(totalPaginasDoc)" title="Última página">
                    <i class="fas fa-fast-forward"></i>
                </button>
                <button id="btnSavePosition" class="btn btn-sm btn-outline-success ms-3" onclick="guardarPosicionManual()" title="Guardar posición actual (Ctrl+S)">
                    <i class="fas fa-bookmark"></i> Guardar posición
                </button>
                <div class="size-selector">
                    <label for="textSizeSelect"><i class="fas fa-font"></i></label>
                    <select id="textSizeSelect" onchange="cambiarTamanioTexto(this.value)">
                        <option value="1.35">Texto chico</option>
                        <option value="1.87" selected>Texto normal</option>
                        <option value="2.38">Texto grande</option>
                        <option value="2.9">Texto extragrande</option>
                    </select>
                </div>
            </div>

            <!-- Loading indicator para páginas -->
            <div id="pageLoading" class="loading-overlay">
                <div class="loader"></div>
                <span>Cargando página...</span>
            </div>

            <div class="markdown-content" id="markdownContent">
                <!-- El contenido del documento se cargará aquí -->
            </div>
        </div>
    </div>

    <!-- Contenedor para toasts -->
    <div class="toast-container"></div>
    <button class="floating-button" onclick="scrollToTop()" title="Volver arriba">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const usuario = "{{ usuario }}";  // Variable global para el usuario actual
        let documentoActualId = null;     // ID del documento actual
        let paginaActual = 1;            // Página actual del documento
        let totalPaginasDoc = 0;         // Total de páginas del documento
        let cargandoPagina = false;      // Flag para evitar múltiples cargas simultáneas
        let paginaBusqueda = 1;          // Página actual de búsqueda
        let totalPaginasBusqueda = 1;    // Total de páginas de búsqueda

        function mostrarToast(mensaje) {
            const toastContainer = document.querySelector('.toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = mensaje;
            toastContainer.appendChild(toast);
            
            // Mostrar el toast
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Ocultar y eliminar el toast después de 3 segundos
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function guardarPosicion() {
            if (!usuario || !documentoActualId) return;
            
            try {
                const response = await fetch(`/api/posicion/${documentoActualId}?usuario=${usuario}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        pagina: paginaActual,
                        posicion: window.scrollY 
                    })
                });
                
                if (response.ok) {
                    mostrarToast('Posición guardada');
                }
            } catch (error) {
                console.error('Error al guardar posición:', error);
            }
        }

        function guardarPosicionManual() {
            guardarPosicion();
        }

        async function cargarUltimaPosicion() {
            if (!usuario || !documentoActualId) return { pagina: 1, posicion: 0 };
            
            try {
                const response = await fetch(`/api/posicion/${documentoActualId}?usuario=${usuario}`);
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error al cargar posición:', error);
                return { pagina: 1, posicion: 0 };
            }
        }

        function buscarDocumentos(pagina) {
            const titulo = document.getElementById('searchTitulo').value;
            const autor = document.getElementById('searchAutor').value;
            const tema = document.getElementById('searchTema').value;
            
            if (pagina) {
                paginaBusqueda = pagina;
            } else {
                paginaBusqueda = 1;
            }

            const params = new URLSearchParams({
                titulo: titulo,
                autor: autor,
                tema: tema,
                pagina: paginaBusqueda,
                limite: 20
            });

            if (usuario) {
                params.append('usuario', usuario);
            }

            // Mostrar loading
            document.getElementById('searchLoading').classList.add('show');
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('searchPagination').innerHTML = '';

            fetch(`/api/buscar?${params.toString()}`)
                .then(response => response.json())
                .then(data => {
                    const documentos = data.documentos || [];
                    const total = data.total || 0;
                    totalPaginasBusqueda = data.total_paginas || 1;
                    paginaBusqueda = data.pagina || 1;

                    document.getElementById('searchLoading').classList.remove('show');
                    const searchResults = document.getElementById('searchResults');
                    searchResults.innerHTML = '';
                    
                    if (documentos.length === 0) {
                        searchResults.innerHTML = '<p class="text-center text-muted">No se encontraron documentos.</p>';
                        return;
                    }
                    
                    documentos.forEach(doc => {
                        const isPublic = !doc.usuario;
                        const isOwner = doc.usuario === usuario;
                        const badge = isPublic ? 
                            '<span class="badge badge-public">Público</span>' : 
                            (isOwner ? '<span class="badge badge-private">Propio</span>' : '');
                        
                        const docElement = document.createElement('div');
                        docElement.className = 'document-item';
                        docElement.innerHTML = `
                            <div style="margin-right: 50px;">
                                <h4>${doc.titulo}${badge}</h4>
                                <p>Autor: ${doc.autor} | Tema: ${doc.tema}</p>
                            </div>
                            ${doc.can_delete ? `<button class="delete-btn" onclick="event.stopPropagation(); borrarDocumento('${doc._id}')">
                                Borrar
                            </button>` : ''}
                        `;
                        docElement.onclick = () => cargarDocumento(doc._id);
                        searchResults.appendChild(docElement);
                    });

                    // Renderizar paginación
                    renderizarPaginacionBusqueda();

                    document.getElementById('documentList').style.display = 'block';
                    document.getElementById('documentContent').style.display = 'none';
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('searchLoading').classList.remove('show');
                    document.getElementById('searchResults').innerHTML = '<p class="text-center text-danger">Error al cargar documentos.</p>';
                });
        }

        function renderizarPaginacionBusqueda() {
            const container = document.getElementById('searchPagination');
            container.innerHTML = '';
            
            if (totalPaginasBusqueda <= 1) return;
            
            // Botón anterior
            const btnPrev = document.createElement('button');
            btnPrev.innerHTML = '<i class="fas fa-chevron-left"></i>';
            btnPrev.disabled = paginaBusqueda <= 1;
            btnPrev.onclick = () => buscarDocumentos(paginaBusqueda - 1);
            container.appendChild(btnPrev);
            
            // Números de página (máximo 5 a la vez)
            const maxVisible = 5;
            let start = Math.max(1, paginaBusqueda - Math.floor(maxVisible / 2));
            let end = Math.min(totalPaginasBusqueda, start + maxVisible - 1);
            if (end - start + 1 < maxVisible) {
                start = Math.max(1, end - maxVisible + 1);
            }
            
            if (start > 1) {
                const firstBtn = document.createElement('button');
                firstBtn.textContent = '1';
                firstBtn.onclick = () => buscarDocumentos(1);
                container.appendChild(firstBtn);
                if (start > 2) {
                    const ellipsis = document.createElement('span');
                    ellipsis.textContent = '...';
                    ellipsis.className = 'page-info';
                    container.appendChild(ellipsis);
                }
            }
            
            for (let i = start; i <= end; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = i === paginaBusqueda ? 'active' : '';
                btn.onclick = () => buscarDocumentos(i);
                container.appendChild(btn);
            }
            
            if (end < totalPaginasBusqueda) {
                if (end < totalPaginasBusqueda - 1) {
                    const ellipsis = document.createElement('span');
                    ellipsis.textContent = '...';
                    ellipsis.className = 'page-info';
                    container.appendChild(ellipsis);
                }
                const lastBtn = document.createElement('button');
                lastBtn.textContent = totalPaginasBusqueda;
                lastBtn.onclick = () => buscarDocumentos(totalPaginasBusqueda);
                container.appendChild(lastBtn);
            }
            
            // Botón siguiente
            const btnNext = document.createElement('button');
            btnNext.innerHTML = '<i class="fas fa-chevron-right"></i>';
            btnNext.disabled = paginaBusqueda >= totalPaginasBusqueda;
            btnNext.onclick = () => buscarDocumentos(paginaBusqueda + 1);
            container.appendChild(btnNext);
        }

        async function cargarDocumento(id) {
            try {
                documentoActualId = id;
                paginaActual = 1;
                totalPaginasDoc = 0;
                
                // Mostrar loading
                document.getElementById('pageLoading').classList.add('show');
                document.getElementById('markdownContent').innerHTML = '';

                const response = await fetch(`/api/documento/${id}`);
                const data = await response.json();
                
                document.getElementById('documentList').style.display = 'none';
                const contentDiv = document.getElementById('documentContent');
                contentDiv.style.display = 'block';
                
                // Actualizar contenido y metadatos
                document.getElementById('markdownContent').innerHTML = data.contenido_html;
                totalPaginasDoc = data.total_paginas;
                paginaActual = data.pagina_actual;
                
                // Actualizar navegación
                document.getElementById('totalPaginas').textContent = totalPaginasDoc;
                document.getElementById('pageInput').value = paginaActual;
                document.getElementById('pageInput').max = totalPaginasDoc;
                actualizarBotonesNavegacion();
                
                document.getElementById('pageLoading').classList.remove('show');

                // Aplicar tamaño de texto guardado
                aplicarTamanioGuardado();

                // Si hay usuario, cargar última posición guardada
                if (usuario) {
                    const posicion = await cargarUltimaPosicion();
                    if (posicion.pagina && posicion.pagina > 1) {
                        // Ir a la página guardada
                        await irAPagina(posicion.pagina);
                        setTimeout(() => {
                            window.scrollTo(0, posicion.posicion || 0);
                        }, 100);
                    }
                    
                    // Agregar evento de doble click para guardar posición
                    document.getElementById('markdownContent').addEventListener('dblclick', () => {
                        guardarPosicion();
                    });
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('pageLoading').classList.remove('show');
                document.getElementById('markdownContent').innerHTML = '<p class="text-center text-danger">Error al cargar el documento.</p>';
            }
        }

        async function irAPagina(numeroPagina) {
            if (!documentoActualId || cargandoPagina) return;
            if (numeroPagina < 1 || numeroPagina > totalPaginasDoc) return;
            if (numeroPagina === paginaActual) return;
            
            cargandoPagina = true;
            paginaActual = numeroPagina;
            
            try {
                // Mostrar loading
                document.getElementById('pageLoading').classList.add('show');
                document.getElementById('markdownContent').style.opacity = '0.3';
                
                const response = await fetch(`/api/documento/${documentoActualId}/pagina/${numeroPagina}`);
                const data = await response.json();
                
                document.getElementById('markdownContent').innerHTML = data.contenido_html;
                totalPaginasDoc = data.total_paginas;
                paginaActual = data.pagina_actual;
                
                // Actualizar navegación
                document.getElementById('totalPaginas').textContent = totalPaginasDoc;
                document.getElementById('pageInput').value = paginaActual;
                document.getElementById('pageInput').max = totalPaginasDoc;
                actualizarBotonesNavegacion();
                
                // Aplicar tamaño de texto guardado
                aplicarTamanioGuardado();

                // Scroll al inicio
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
            } catch (error) {
                console.error('Error al cargar página:', error);
                mostrarToast('Error al cargar la página');
            } finally {
                document.getElementById('pageLoading').classList.remove('show');
                document.getElementById('markdownContent').style.opacity = '1';
                cargandoPagina = false;
            }
        }

        function actualizarBotonesNavegacion() {
            document.getElementById('btnFirstPage').disabled = paginaActual <= 1;
            document.getElementById('btnPrevPage').disabled = paginaActual <= 1;
            document.getElementById('btnNextPage').disabled = paginaActual >= totalPaginasDoc;
            document.getElementById('btnLastPage').disabled = paginaActual >= totalPaginasDoc;
        }

        function borrarDocumento(id) {
            if (confirm('¿Estás seguro de que deseas borrar este documento?')) {
                fetch(`/api/documento/${id}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(result => {
                    if (result.status === 'success') {
                        mostrarToast('Documento eliminado');
                        // Actualizar la lista de documentos
                        buscarDocumentos(paginaBusqueda);
                    } else {
                        mostrarToast('Error al borrar: ' + (result.error || result.message));
                    }
                })
                .catch(error => {
                    mostrarToast('Error al borrar el documento');
                });
            }
        }

        function volverALista() {
            document.getElementById('documentList').style.display = 'block';
            document.getElementById('documentContent').style.display = 'none';
            // Refrescar la lista al volver
            buscarDocumentos(paginaBusqueda);
        }

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // Permitir búsqueda con Enter
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active && ['searchTitulo', 'searchAutor', 'searchTema'].includes(active.id)) {
                    buscarDocumentos();
                }
            }
        });

        function cambiarTamanioTexto(valorRem) {
            // Guardar preferencia
            localStorage.setItem('teccam_text_size', valorRem);
            
            const container = document.getElementById('markdownContent');
            if (!container) return;
            
            // Aplicar a <p>, <h6> y <li> dentro de listas (<ul>)
            const elementos = container.querySelectorAll('p, h6, ul > li, ol > li');
            elementos.forEach(el => {
                el.style.fontSize = valorRem + 'rem';
            });
        }

        function aplicarTamanioGuardado() {
            const saved = localStorage.getItem('teccam_text_size');
            const select = document.getElementById('textSizeSelect');
            if (saved && select) {
                select.value = saved;
                cambiarTamanioTexto(saved);
            } else if (select) {
                // Valor por defecto: "Texto normal" = 1.87rem
                select.value = '1.87';
                cambiarTamanioTexto('1.87');
            }
        }

        // Listener global de teclado (registrado UNA sola vez)
        document.addEventListener('keydown', (e) => {
            // Ctrl+S para guardar posición (si hay usuario)
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                if (usuario) {
                    e.preventDefault();
                    guardarPosicion();
                }
                return;
            }
            
            // Ignorar si el usuario está escribiendo en un input
            const activeTag = document.activeElement ? document.activeElement.tagName : '';
            if (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT') return;
            
            const docContent = document.getElementById('documentContent');
            const docList = document.getElementById('documentList');
            
            // Flecha izquierda: página anterior
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                if (docContent && docContent.style.display === 'block') {
                    irAPagina(paginaActual - 1);
                } else if (docList && docList.style.display !== 'none') {
                    if (paginaBusqueda > 1) {
                        buscarDocumentos(paginaBusqueda - 1);
                    }
                }
            }
            
            // Flecha derecha: página siguiente
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                if (docContent && docContent.style.display === 'block') {
                    irAPagina(paginaActual + 1);
                } else if (docList && docList.style.display !== 'none') {
                    if (paginaBusqueda < totalPaginasBusqueda) {
                        buscarDocumentos(paginaBusqueda + 1);
                    }
                }
            }
        });

        // Cargar documentos al iniciar
        window.onload = () => buscarDocumentos(1);
    </script>
</body>
</html>
